name: festa_ordini
description: Gestione ordini festa di paese
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: 3.12.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  
  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Navigation
  go_router: ^17.2.3
  
  # PDF Generation (resoconto)
  pdf: ^3.10.7
  printing: ^5.11.1
  file_picker: '>=12.0.0-beta.4 <13.0.0'

  # Thermal POS Printing
  flutter_thermal_printer: ^2.2.1
  
  # UI
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.3
  flutter_localization: ^0.4.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  build_runner: ^2.4.7
  riverpod_generator: ^4.0.0+1
  drift_dev: ^2.14.0
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1

flutter_icons:
  macos:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    